<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="compose-otp-field: OTP and PIN input for Jetpack Compose" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A78"/>
      <stop offset="1" stop-color="#3A4AA0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F2FB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1240" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="1130" cy="70" r="190" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="60" cy="560" r="150" fill="#F2C062" opacity="0.06"/>

  <!-- Title -->
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="170" fill="#F2C062" font-size="22" font-weight="700" letter-spacing="3">JETPACK COMPOSE</text>
    <text x="80" y="238" fill="#FFFFFF" font-size="56" font-weight="800">compose-otp-field</text>
    <text x="80" y="290" fill="#DDE1FF" font-size="25">OTP and PIN input with SMS autofill, paste,</text>
    <text x="80" y="324" fill="#DDE1FF" font-size="25">secure mode, four cell styles and shake on error.</text>
    <g font-size="16" font-weight="600">
      <rect x="80" y="370" width="130" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="145" y="395" fill="#FFFFFF" text-anchor="middle">SMS autofill</text>
      <rect x="222" y="370" width="100" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="272" y="395" fill="#FFFFFF" text-anchor="middle">PIN pad</text>
      <rect x="334" y="370" width="132" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="400" y="395" fill="#FFFFFF" text-anchor="middle">Secure mode</text>
      <rect x="478" y="370" width="178" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="567" y="395" fill="#FFFFFF" text-anchor="middle">Resend countdown</text>
    </g>
  </g>

  <!-- Verification card -->
  <g filter="url(#shadow)">
    <rect x="720" y="92" width="480" height="376" rx="32" fill="url(#card)"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Shield -->
    <circle cx="960" cy="160" r="42" fill="#DDE1FF"/>
    <path d="M960 132 L982 141 L982 160 C982 175 972 184 960 190 C948 184 938 175 938 160 L938 141 Z" fill="#3A4AA0"/>
    <path d="M950 161 L957 168 L971 153" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="960" y="236" fill="#1A1B21" font-size="26" font-weight="700" text-anchor="middle">Verify it's you</text>
    <text x="960" y="264" fill="#45464F" font-size="16" text-anchor="middle">Enter the 6-digit code we sent you</text>

    <!-- Cells: four filled, the fifth active with a cursor, the sixth empty -->
    <g font-size="30" font-weight="700" fill="#1A1B21" text-anchor="middle">
      <rect x="767" y="298" width="56" height="66" rx="10" fill="#FFFFFF" stroke="#767680" stroke-width="2"/>
      <text x="795" y="342">4</text>
      <rect x="833" y="298" width="56" height="66" rx="10" fill="#FFFFFF" stroke="#767680" stroke-width="2"/>
      <text x="861" y="342">8</text>
      <rect x="899" y="298" width="56" height="66" rx="10" fill="#FFFFFF" stroke="#767680" stroke-width="2"/>
      <text x="927" y="342">2</text>
      <rect x="965" y="298" width="56" height="66" rx="10" fill="#FFFFFF" stroke="#767680" stroke-width="2"/>
      <text x="993" y="342">9</text>
      <rect x="1031" y="298" width="56" height="66" rx="10" fill="#FFFFFF" stroke="#3A4AA0" stroke-width="3.5"/>
      <rect x="1057.5" y="317" width="3" height="28" rx="1.5" fill="#3A4AA0"/>
      <rect x="1097" y="298" width="56" height="66" rx="10" fill="#FFFFFF" stroke="#C6C5D0" stroke-width="2"/>
    </g>
    <text x="960" y="410" fill="#3A4AA0" font-size="16" font-weight="600" text-anchor="middle">Resend code in 0:42</text>
    <!-- PIN dots -->
    <g>
      <circle cx="918" cy="440" r="7" fill="#3A4AA0"/>
      <circle cx="946" cy="440" r="7" fill="#3A4AA0"/>
      <circle cx="974" cy="440" r="7" fill="none" stroke="#767680" stroke-width="2"/>
      <circle cx="1002" cy="440" r="7" fill="none" stroke="#767680" stroke-width="2"/>
    </g>
  </g>
</svg>
